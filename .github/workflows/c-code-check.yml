name: C code check

on:
  push:
  pull_request:

jobs:
  compile-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile RS485 and Modbus examples
        working-directory: 03_RS485_Modbus/codes
        run: make

      - name: Compile embedded Linux examples
        working-directory: 06_嵌入式Linux/codes
        run: make

      - name: Compile FreeRTOS architecture example
        working-directory: 04_FreeRTOS/codes
        run: make
